apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-auth-server
  labels:
    app: dev-auth-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dev-auth-server
  template:
    metadata:
      labels:
        app: dev-auth-server
    spec:
      imagePullSecrets:
        - name: nexus-registry-secret
      containers:
        - name: dev-auth-server
          image: registry.local.com/dev-auth-server:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: dev-auth-server-config

            - secretRef:
                name: dev-auth-server-secret